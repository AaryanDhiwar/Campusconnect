<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Connect</title>

    <link rel="stylesheet" href="role.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="logo">
        <i class="fa-solid fa-users"></i>
        <h2>Campus Connect</h2>
    </div>

    <div class="container">

        <h1>Select Your Role</h1>

        <p>Choose how you will be using Campus Connect</p>

        <div class="roles">

            <!-- Student -->
            <div class="card student">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>Student</h2>

                <p>Access notices, study materials and campus events.</p>

                <button onclick="window.location.href='studentregistration.html'">
                    Continue as Student
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- Faculty -->
            <div class="card faculty">
                <i class="fa-solid fa-chalkboard-user"></i>
                <h2>Faculty</h2>

                <p>Manage notices, materials, events and students.</p>

                <button onclick="window.location.href='facultyregistration.html'">
                    Continue as Faculty
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </div>

    </div>

</body>

</html>
