<section class="Container2">

    <h1 class="title">My Profile</h1>

    <section class="detailinfo">

        <!-- Profile Photo -->
        <div class="MyProfile">

            <img
                src="./images.jpeg"
                id="profileImage"
                alt="Profile Image"
                class="profile-photo"
            >

            <br>

            <button
                class="edt-btn"
                id="edit-profile-btn">
                Edit Profile
            </button>

        </div>


        <!-- Faculty Information -->
        <div class="Carddetail">

            <h2 id="profile-name">
                Loading...
            </h2>


            <div class="detail">
                <span>Faculty ID</span>

                <span id="profile-faculty-id">
                    Loading...
                </span>
            </div>


            <div class="detail">
                <span>Department</span>

                <span id="profile-department">
                    Loading...
                </span>
            </div>


            <div class="detail">
                <span>Email</span>

                <span id="profile-email">
                    Loading...
                </span>
            </div>

        </div>


        <!-- About -->
        <div class="cardabout">

            <h4>About Me</h4>

            <p id="profile-about">
                Tell us something about yourself.
            </p>


            <h4 class="skills-title">
                Skills
            </h4>

            <div class="skills">

                <span class="skill">Teaching</span>
                <span class="skill">Mentoring</span>
                <span class="skill">Research</span>

            </div>

        </div>

    </section>

</section>
