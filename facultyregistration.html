<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Registration - Campus Connect</title>

    <link rel="stylesheet" href="facultyregistration.css">

</head>


<body>

    <div class="registration-container">

        <div class="registration-card">

            <div class="logo">
                <span>🎓</span>
                <h2>Campus Connect</h2>
            </div>


            <h1>Faculty Registration</h1>

            <p class="subtitle">
                Create your Campus Connect faculty account
            </p>


            <form id="facultyRegistrationForm">


                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="faculty_id">
                        Faculty ID
                    </label>

                    <input
                        type="text"
                        id="faculty_id"
                        name="faculty_id"
                        placeholder="Enter faculty ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="e.g. Computer Engineering"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="registerBtn"
                >
                    Register
                </button>


                <p id="message"></p>

            </form>


            <div class="login-link">

                Already have an account?

                <a href="facultylogin.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script>

        const form =
            document.getElementById("facultyRegistrationForm");

        const message =
            document.getElementById("message");

        const registerBtn =
            document.getElementById("registerBtn");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            registerBtn.disabled = true;

            registerBtn.textContent = "Registering...";

            message.textContent = "";

            message.className = "";


            const facultyData = {

                fullname:
                    document.getElementById("fullname").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                password:
                    document.getElementById("password").value,

                faculty_id:
                    document.getElementById("faculty_id").value.trim(),

                department:
                    document.getElementById("department").value.trim()

            };


            try {

                const response = await fetch(
                    "http://localhost:3000/api/faculty/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(facultyData)
                    }
                );


                const result = await response.json();


                if (response.ok) {

                    message.textContent =
                        result.message;

                    message.className =
                        "success";


                    form.reset();


                    setTimeout(() => {

                        window.location.href =
                            "facultylogin.html";

                    }, 1500);


                } else {

                    message.textContent =
                        result.message;

                    message.className =
                        "error";

                }


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to the server.";

                message.className =
                    "error";

            }


            registerBtn.disabled = false;

            registerBtn.textContent = "Register";

        });

    </script>

</body>

</html>
