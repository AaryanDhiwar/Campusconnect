<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - Campus Connect</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="login-page">

    <div class="login-left">

        <div class="brand">
            <i class="fa-solid fa-users"></i>
            Campus Connect
        </div>

        <h1>
            Welcome back,<br>
            <span>Student.</span>
        </h1>

        <p>
            Login to access notices, study materials,
            events and your senior network.
        </p>

    </div>


    <div class="login-box">

        <div class="login-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <h2>Student Login</h2>

        <p class="subtitle">
            Login to your Campus Connect account
        </p>


        <form id="studentLoginForm">

            <input type="hidden"
                   name="role"
                   value="student">


            <label>Email</label>

            <div class="input-box">

                <i class="fa-regular fa-envelope"></i>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <label>Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <button type="submit">
                Login
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="studentregistration.html">
                Register
            </a>

        </p>


        <a class="faculty-link"
           href="facultylogin.html">

            Login as Faculty

        </a>

    </div>

</div>

<script>

const loginForm =
    document.getElementById("studentLoginForm");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.querySelector('input[name="email"]').value.trim();

    const password =
        document.querySelector('input[name="password"]').value;


    try {

        const response = await fetch(
            "http://localhost:3000/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    password: password,

                    role: "student"

                })

            }
        );


        const result = await response.json();


        if (!response.ok) {

            alert(result.message);

            return;

        }


        // Save login information

        localStorage.setItem(
            "campusconnect_token",
            result.token
        );


        localStorage.setItem(
            "campusconnect_user",
            JSON.stringify(result.user)
        );


        alert("Login successful!");


        window.location.href = "dashboard.html";


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );

    }

});

</script>

</body>
</html>
